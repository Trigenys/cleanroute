<script>
const cityData={
dakar:{q1:{name:"Plateau / Centre",desc:"Tournée quotidienne · données démo",rate:"94%",clients:"142"},q2:{name:"Almadies / Nord",desc:"Collecte Lun-Mer-Ven · données démo",rate:"98%",clients:"88"},q3:{name:"Médina / Ouest",desc:"Circuit résidentiel · données démo",rate:"87%"},q4:{name:"Zone Résidentielle Est",desc:"Extension de secteur · données démo",rate:"91%"},mapTitle:"Prototype cartographique : Dakar Plateau"},
abidjan:{q1:{name:"Cocody / Danga",desc:"Tournée quotidienne · données démo",rate:"96%",clients:"189"},q2:{name:"Plateau Affaires",desc:"Collecte nocturne · données démo",rate:"99%",clients:"74"},q3:{name:"Marcory Résidentiel",desc:"Relances individuelles · données démo",rate:"89%"},q4:{name:"Riviera Palmeraie",desc:"Secteur en expansion · données démo",rate:"92%"},mapTitle:"Prototype cartographique : Cocody Centre"},
douala:{q1:{name:"Bonanjo / Administratif",desc:"Tournée matinale · données démo",rate:"95%",clients:"128"},q2:{name:"Akwa Centre",desc:"Circuit urbain · données démo",rate:"91%",clients:"204"},q3:{name:"Bonapriso Sud",desc:"Circuit résidentiel · données démo",rate:"97%"},q4:{name:"Bali / Koumassi",desc:"Nouveaux abonnés · données démo",rate:"88%"},mapTitle:"Prototype cartographique : Douala Bonanjo"},
bamako:{q1:{name:"Badalabougou",desc:"Tournée de quartier · données démo",rate:"93%",clients:"115"},q2:{name:"ACI 2000",desc:"Secteur mixte · données démo",rate:"97%",clients:"140"},q3:{name:"Hippodrome",desc:"Tournée matinale · données démo",rate:"86%"},q4:{name:"Korofina Nord",desc:"Secteur pilote · données démo",rate:"90%"},mapTitle:"Prototype cartographique : Bamako ACI 2000"},
cotonou:{q1:{name:"Haie Vive / Ambassades",desc:"Collecte récurrente · données démo",rate:"98%",clients:"105"},q2:{name:"Ganhi / Marché",desc:"Circuit dense · données démo",rate:"92%",clients:"165"},q3:{name:"Fidjrossè Plage",desc:"Circuit résidentiel · données démo",rate:"89%"},q4:{name:"Cadjehoun",desc:"Extension récente · données démo",rate:"94%"},mapTitle:"Prototype cartographique : Cotonou Haie Vive"}};
function switchCity(cityKey){const d=cityData[cityKey];if(!d)return;["q1","q2","q3","q4"].forEach((q)=>{const n=document.getElementById(q+"-name"),desc=document.getElementById(q+"-desc"),rate=document.getElementById(q+"-rate"),clients=document.getElementById(q+"-clients");if(n)n.textContent=d[q].name;if(desc)desc.textContent=d[q].desc;if(rate)rate.textContent=d[q].rate;if(clients&&d[q].clients)clients.textContent=d[q].clients;});const map=document.getElementById("map-title");if(map)map.textContent=d.mapTitle;}
function filterNeighborhoods(status,btn){document.querySelectorAll(".filter-btn").forEach(b=>{b.classList.remove("bg-primary","text-on-primary");b.classList.add("bg-surface-container-lowest","text-on-surface-variant")});btn.classList.add("bg-primary","text-on-primary");btn.classList.remove("bg-surface-container-lowest","text-on-surface-variant");document.querySelectorAll("#neighborhood-list > div").forEach(card=>{card.style.display=(status==="all"||card.getAttribute("data-status")===status)?"block":"none"})}
function logHeroAction(actionName){const f=document.getElementById("hero-feedback");if(!f)return;f.textContent='Action "'+actionName+'" enregistrée localement';f.classList.remove("opacity-0");setTimeout(()=>f.classList.add("opacity-0"),2500)}
document.addEventListener("DOMContentLoaded",()=>{const s=document.getElementById("city-select");if(s)switchCity(s.value);});
</script>
