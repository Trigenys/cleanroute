openapi: 3.1.0
info:
  title: CleanRoute Sync API
  version: 1.0.0
  description: |
    Protocol v1 contract for optional multi-device synchronization.
    Authentication is transport-level and intentionally not modeled in Android domain entities.
servers:
  - url: https://sync.example.invalid
paths:
  /sync/v1/push:
    post:
      operationId: pushMutations
      summary: Push idempotent local mutations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Per-operation acknowledgements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: Structurally invalid batch
  /sync/v1/pull:
    get:
      operationId: pullChanges
      summary: Pull ordered server changes after a cursor
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: deviceId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Ordered change page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
components:
  schemas:
    AggregateType:
      type: string
      enum: [customer, collection_visit, payment, contact_action, referral]
    MutationType:
      type: string
      enum: [upsert, delete]
    PushRequest:
      type: object
      required: [protocolVersion, workspaceId, deviceId, operations]
      properties:
        protocolVersion: { type: integer, const: 1 }
        workspaceId: { type: string, minLength: 1 }
        deviceId: { type: string, minLength: 1 }
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/MutationEnvelope' }
    MutationEnvelope:
      type: object
      required:
        - operationId
        - aggregateType
        - aggregateId
        - mutation
        - clientRevision
        - occurredAt
      properties:
        operationId: { type: string, minLength: 1 }
        aggregateType: { $ref: '#/components/schemas/AggregateType' }
        aggregateId: { type: string, minLength: 1 }
        mutation: { $ref: '#/components/schemas/MutationType' }
        clientRevision: { type: string, minLength: 1 }
        baseServerRevision:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: 'null' }
        occurredAt: { type: string, format: date-time }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/CustomerPayload' }
            - { $ref: '#/components/schemas/CollectionVisitPayload' }
            - { $ref: '#/components/schemas/PaymentPayload' }
            - { $ref: '#/components/schemas/ContactActionPayload' }
            - { $ref: '#/components/schemas/ReferralPayload' }
            - { type: 'null' }
        tombstone:
          oneOf:
            - { $ref: '#/components/schemas/Tombstone' }
            - { type: 'null' }
    CustomerPayload:
      type: object
      required: [id, name, zoneId, servicePlanId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        externalId: { type: [string, 'null'] }
        name: { type: string }
        phone: { type: [string, 'null'] }
        zoneId: { type: string }
        addressLabel: { type: [string, 'null'] }
        servicePlanId: { type: string }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionVisitPayload:
      type: object
      required: [id, routeDayId, customerId, scheduledDate, status, revision]
      properties:
        id: { type: string }
        routeDayId: { type: string }
        customerId: { type: string }
        scheduledDate: { type: string, format: date }
        status: { type: string, enum: [scheduled, collected, absent, no_waste] }
        statusChangedAt: { type: [string, 'null'], format: date-time }
        revision: { type: integer, minimum: 0 }
    PaymentPayload:
      type: object
      required: [id, customerId, servicePeriod, amountXaf, methodCode, state, recordedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        servicePeriod: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        amountXaf: { type: integer, minimum: 1 }
        methodCode: { type: string }
        state: { type: string, enum: [recorded, reversed] }
        recordedAt: { type: string, format: date-time }
        reversedAt: { type: [string, 'null'], format: date-time }
    ContactActionPayload:
      type: object
      required: [id, customerId, channel, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        channel: { type: string, enum: [call, whatsapp] }
        createdAt: { type: string, format: date-time }
    ReferralPayload:
      type: object
      required:
        - id
        - referrerCustomerId
        - referredCustomerId
        - referralCode
        - rewardStatus
        - attributedAt
      properties:
        id: { type: string }
        referrerCustomerId: { type: string }
        referredCustomerId: { type: string }
        referralCode: { type: string }
        rewardStatus: { type: string, enum: [pending, eligible, awarded] }
        attributedAt: { type: string, format: date-time }
        qualifiedAt: { type: [string, 'null'], format: date-time }
        awardedAt: { type: [string, 'null'], format: date-time }
    Tombstone:
      type: object
      required: [aggregateType, aggregateId, deletedAt, serverRevision]
      properties:
        aggregateType: { $ref: '#/components/schemas/AggregateType' }
        aggregateId: { type: string }
        deletedAt: { type: string, format: date-time }
        serverRevision: { type: integer, minimum: 1 }
    Ack:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string }
        status:
          type: string
          enum: [applied, duplicate, conflict, rejected]
        serverRevision:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: 'null' }
        reasonCode: { type: [string, 'null'] }
    PushResponse:
      type: object
      required: [protocolVersion, acks]
      properties:
        protocolVersion: { type: integer, const: 1 }
        acks:
          type: array
          items: { $ref: '#/components/schemas/Ack' }
    RemoteChange:
      type: object
      required:
        - serverRevision
        - aggregateType
        - aggregateId
        - mutation
      properties:
        serverRevision: { type: integer, minimum: 1 }
        aggregateType: { $ref: '#/components/schemas/AggregateType' }
        aggregateId: { type: string }
        mutation: { $ref: '#/components/schemas/MutationType' }
        payload: { type: [object, 'null'] }
        tombstone:
          oneOf:
            - { $ref: '#/components/schemas/Tombstone' }
            - { type: 'null' }
    PullResponse:
      type: object
      required: [protocolVersion, nextCursor, hasMore, changes]
      properties:
        protocolVersion: { type: integer, const: 1 }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        changes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RemoteChange' }
