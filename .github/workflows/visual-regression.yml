name: Visual regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Detect golden baseline
        id: baseline
        shell: bash
        run: |
          if find app/src/test/screenshots -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify golden screenshots
        if: steps.baseline.outputs.exists == 'true'
        run: gradle :app:verifyRoborazziDebug

      - name: Record bootstrap candidates
        if: steps.baseline.outputs.exists != 'true'
        run: gradle :app:recordRoborazziDebug

      - name: Upload screenshot candidates
        if: steps.baseline.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-bootstrap-goldens
          path: app/src/test/screenshots/
          if-no-files-found: error

      - name: Commit bootstrap goldens
        if: >-
          steps.baseline.outputs.exists != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots/
          if git diff --cached --quiet; then
            echo "No golden changes to commit."
            exit 0
          fi
          git commit -m "test(visual): commit Roborazzi golden baseline"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload failed visual diff
        if: failure() && steps.baseline.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-visual-diff
          if-no-files-found: warn
          path: |
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
