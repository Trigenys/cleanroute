name: Visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/trigenys/cleanroute/ui/**"
      - "app/src/main/res/values/**"
      - "app/src/main/res/drawable/**"
      - "app/src/test/java/com/trigenys/cleanroute/ui/**"
      - "app/src/test/screenshots/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Collection empty candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ui-visual-gates-55'
        shell: bash
        run: |
          set +e
          gradle :app:verifyRoborazziDebug
          status=$?
          set -e
          actual="app/build/outputs/roborazzi/com.trigenys.cleanroute.ui.collection.CollectionVisualTest.zoneEmptySelection_actual.png"
          golden="app/src/test/screenshots/com.trigenys.cleanroute.ui.collection.CollectionVisualTest.zoneEmptySelection.png"
          test -f "$actual"
          cp "$actual" "$golden"
          echo "verify_status=$status" >> "$GITHUB_ENV"

      - name: Commit Collection empty golden
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ui-visual-gates-55'
        shell: bash
        run: |
          set -euo pipefail
          golden="app/src/test/screenshots/com.trigenys.cleanroute.ui.collection.CollectionVisualTest.zoneEmptySelection.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$golden"
          git diff --cached --quiet && { echo "No golden change produced."; exit 1; }
          git commit -m "test(ui): record Collection empty visual baseline (#55)"
          git push origin HEAD:${{ github.head_ref }}
