name: Visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/trigenys/cleanroute/ui/**"
      - "app/src/main/res/values/**"
      - "app/src/main/res/drawable/**"
      - "app/src/test/java/com/trigenys/cleanroute/ui/**"
      - "app/src/test/screenshots/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Record intentional Stitch payments and Excel goldens
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ui-payments-excel-54'
        run: gradle :app:recordRoborazziDebug

      - name: Commit refreshed payments and Excel goldens
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ui-payments-excel-54'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/test/screenshots; then
            echo "Golden screenshots already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git commit -m "test(ui): refresh Roborazzi payments and Excel goldens for Stitch convergence (#55)"
          git push origin HEAD:${{ github.head_ref }}
