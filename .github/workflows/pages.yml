name: Landing / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Pilot APK"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: "pages-branch"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build static landing
        run: python site/build.py
      - name: Validate landing contract
        shell: bash
        run: |
          test -s site/dist/index.html
          test -s site/dist/cleanroute-mark.svg
          test -s site/dist/cleanroute-mark.png
          test -s site/dist/cleanroute-download-qr.svg
          test -s site/dist/CNAME
          grep -q '<title>CleanRoute' site/dist/index.html
          grep -q 'id="le-produit"' site/dist/index.html
          grep -q 'id="pilot-access"' site/dist/index.html
          grep -q 'https://cleanroute.trigenys.com/' site/dist/index.html
          grep -q './cleanroute-mark.svg' site/dist/index.html
          grep -q './cleanroute-download-qr.svg' site/dist/index.html
          grep -q 'https://cleanroute.trigenys.com/CleanRoute-pilot.apk' site/dist/index.html
          ! grep -q 'releases/download/pilot-latest/CleanRoute-pilot.apk' site/dist/index.html
          grep -q 'Télécharger l’application' site/dist/index.html
          grep -q 'ramassage des déchets' site/dist/index.html
          grep -q 'https://cleanroute.trigenys.com/cleanroute-mark.png?v=3' site/dist/index.html
          grep -q 'og:image:type' site/dist/index.html
          grep -q 'Room 2.8.5' site/dist/index.html
          grep -q 'Kotlin 2.4.20' site/dist/index.html
          ! grep -q 'Sync Engine v2.4' site/dist/index.html
          ! grep -qi 'niveau militaire' site/dist/index.html
          ! grep -q 'Déploiement Pilote 2025' site/dist/index.html
          ! grep -q 'GPS actif' site/dist/index.html
          ! grep -q 'KML' site/dist/index.html
          ! grep -q 'chiffrée localement' site/dist/index.html

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Build static landing
        run: python source/site/build.py

      - name: Fetch verified latest pilot APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          gh release download pilot-latest             --repo "$GITHUB_REPOSITORY"             --pattern 'CleanRoute-pilot.apk*'             --dir "$TMP_DIR"             --clobber
          test -s "$TMP_DIR/CleanRoute-pilot.apk"
          test -s "$TMP_DIR/CleanRoute-pilot.apk.sha256"
          EXPECTED="$(awk '{print $1}' "$TMP_DIR/CleanRoute-pilot.apk.sha256")"
          ACTUAL="$(sha256sum "$TMP_DIR/CleanRoute-pilot.apk" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          cp "$TMP_DIR/CleanRoute-pilot.apk" source/site/dist/CleanRoute-pilot.apk

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: publish

      - name: Publish branch content
        shell: bash
        run: |
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R source/site/dist/. publish/
          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "No landing changes to publish."
            exit 0
          fi
          git -C publish commit -m "deploy: CleanRoute landing ${GITHUB_SHA::7}"
          git -C publish push origin HEAD:gh-pages
