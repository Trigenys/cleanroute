name: Pilot APK

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/pilot-apk.yml"
      - "docs/pilot/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build pilot APK
        run: gradle :app:assemblePilot

      - name: Create checksum
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/pilot -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
          printf '%s\n' "$GITHUB_SHA" > app/build/outputs/apk/pilot/commit-sha.txt

      - name: Upload pilot package
        uses: actions/upload-artifact@v7
        with:
          name: cleanroute-pilot-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/pilot/*.apk
            app/build/outputs/apk/pilot/*.sha256
            app/build/outputs/apk/pilot/commit-sha.txt
