name: Pilot APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/pilot-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build pilot APK
        run: gradle :app:assemblePilot

      - name: Create checksum
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/pilot -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
          printf '%s\n' "$GITHUB_SHA" > app/build/outputs/apk/pilot/commit-sha.txt

      - name: Upload pilot package
        uses: actions/upload-artifact@v7
        with:
          name: cleanroute-pilot-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/pilot/*.apk
            app/build/outputs/apk/pilot/*.sha256
            app/build/outputs/apk/pilot/commit-sha.txt

      - name: Publish rolling public pilot release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/pilot -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          mkdir -p release
          cp "$APK" release/CleanRoute-pilot.apk
          sha256sum release/CleanRoute-pilot.apk > release/CleanRoute-pilot.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > release/commit-sha.txt

          cat > release/notes.md <<EOF
          # CleanRoute Pilot

          Public Android pilot build generated from commit `$GITHUB_SHA`.

          This is a pre-release build for product validation. Core field workflows are local-first and usable offline.

          - APK: `CleanRoute-pilot.apk`
          - SHA-256: `CleanRoute-pilot.apk.sha256`
          - Commit: `$GITHUB_SHA`
          EOF

          git tag -f pilot-latest "$GITHUB_SHA"
          git push origin +refs/tags/pilot-latest

          if gh release view pilot-latest >/dev/null 2>&1; then
            gh release edit pilot-latest               --title "CleanRoute Pilot — latest"               --notes-file release/notes.md               --prerelease
          else
            gh release create pilot-latest               --title "CleanRoute Pilot — latest"               --notes-file release/notes.md               --prerelease               --verify-tag
          fi

          gh release upload pilot-latest             release/CleanRoute-pilot.apk             release/CleanRoute-pilot.apk.sha256             release/commit-sha.txt             --clobber

      - name: Trigger Cloudflare Pages rebuild against the published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
          PUBLIC_APK_BASE: https://cleanroute.trigenys.com
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_PAGES_DEPLOY_HOOK:-}" ]; then
            echo "::warning title=Cloudflare rebuild skipped::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK is not set. The production download may serve a stale APK until the next push to main. See docs/deployment/cloudflare-pages.md."
            exit 0
          fi

          # Cloudflare's Git integration already built this push, racing the release upload above.
          # A second build now downloads the asset that was just published.
          curl -fsS -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK" -o /dev/null

          EXPECTED="$(awk '{print $1}' release/CleanRoute-pilot.apk.sha256)"
          for _ in $(seq 1 40); do
            SERVED="$(curl -fsSL "$PUBLIC_APK_BASE/CleanRoute-pilot.apk.sha256" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "Production download serves the published APK ($EXPECTED)."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Stale pilot APK on production::$PUBLIC_APK_BASE/CleanRoute-pilot.apk.sha256 still differs from the published release after 10 minutes. Check the Cloudflare Pages deployment, then retry the deploy hook."
          exit 1
